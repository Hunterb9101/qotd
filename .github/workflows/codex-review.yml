name: Codex review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  codex:
    # Do not make the API key available to code supplied by a fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-review.json
          codex-args: '["--output-schema", ".github/codex/schemas/review.json"]'
          sandbox: read-only
          safety-strategy: drop-sudo

      - name: Enforce Codex verdict
        uses: actions/github-script@v7
        env:
          CODEX_REVIEW: ${{ steps.run_codex.outputs.final-message }}
        with:
          script: |
            const review = JSON.parse(process.env.CODEX_REVIEW);
            if (review.verdict === "no-pass") {
              core.setFailed("Codex review returned no-pass.");
            }

  post-feedback:
    needs: codex
    if: always() && needs.codex.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post review feedback
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const review = JSON.parse(process.env.CODEX_FINAL_MESSAGE);
            const findings = review.findings.length === 0
              ? "No blocking findings."
              : review.findings.map((finding) => [
                  `### ${finding.title}`,
                  `**Location:** ${finding.location}`,
                  `**Failure mode:** ${finding.failure_mode}`,
                  `**Remedy:** ${finding.remedy}`,
                ].join("\n\n")).join("\n\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                `## Codex review — ${review.verdict.toUpperCase()}`,
                review.summary,
                findings,
              ].join("\n\n"),
            });
