name: Validate QOTD BigQuery SQL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bigquery-sql:
    runs-on: ubuntu-latest
    environment: production
    env:
      QOTD_BIGQUERY_DRY_RUN_PROJECT: question-of-the-day-501919
      QOTD_BIGQUERY_DRY_RUN_DATASET: qotd
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate all BigQuery SQL without persistent DML
        run: >-
          python -m pytest -m intg tests/external/storage/test_bigquery.py
          -k 'dry_run_validates_every_canonical_state_query or rollback_validates_idempotent_submission_retry_identity'
