name: Process QOTD Score Events

on:
  schedule:
    # GitHub Actions cron uses UTC. Run at both possible UTC offsets, then
    # admit only the invocation that is in the intended America/Denver hour.
    - cron: "55 13 * * 1-5"
    - cron: "55 14 * * 1-5"
  workflow_dispatch:

concurrency:
  group: qotd-morning-state
  cancel-in-progress: false

jobs:
  process-score-events:
    runs-on: ubuntu-latest
    environment: production
    env:
      QOTD_SENDER: ${{ secrets.QOTD_SENDER }}
      GOOGLE_CLOUD_PROJECT: question-of-the-day-501919
      BIGQUERY_DATASET: qotd
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm scheduled America/Denver hour
        id: scheduled-hour
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(TZ=America/Denver date +%H)" = "07" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "This UTC trigger is not the 07:55 America/Denver invocation; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.scheduled-hour.outputs.proceed == 'true'
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.scheduled-hour.outputs.proceed == 'true'
        run: python -m pip install -r requirements.txt

      - name: Process Organizer Answer instructions
        if: steps.scheduled-hour.outputs.proceed == 'true'
        run: python -m qotd process-set-answers

      - name: Process manual Score Event instructions
        if: steps.scheduled-hour.outputs.proceed == 'true'
        run: python -m qotd process-score-events
