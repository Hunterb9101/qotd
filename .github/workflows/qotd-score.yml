name: Score QOTD Responses

on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

jobs:
  score-responses:
    runs-on: ubuntu-latest
    environment: production
    env:
      QOTD_SENDER: ***SECRET***
      QOTD_GMAIL_USER: ***SECRET***
      QOTD_ORGANIZER: ***SECRET***
      GOOGLE_CLOUD_PROJECT: question-of-the-day-501919
      BIGQUERY_DATASET: qotd
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Score responses
        run: python -m qotd score-responses
