name: Score QOTD Responses

on:
  schedule:
    # GitHub Actions cron is UTC. These are 08:00 America/Denver across DST;
    # the guard below skips the adjacent, non-08:00 trigger.
    - cron: "0 14,15 * * 1-5"
  workflow_dispatch:
    inputs:
      game_date:
        description: "Question date to score, formatted YYYY-MM-DD. Leave blank to score the previous game day."
        required: false
        type: string

concurrency:
  group: qotd-morning-state
  cancel-in-progress: false

jobs:
  score-responses:
    runs-on: ubuntu-latest
    environment: production
    env:
      QOTD_SENDER: ${{ secrets.QOTD_SENDER }}
      GOOGLE_CLOUD_PROJECT: question-of-the-day-501919
      BIGQUERY_DATASET: qotd
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Confirm scheduled Mountain time
        id: scheduled-local-time
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo

          is_scoring_hour = datetime.now(ZoneInfo("America/Denver")).hour == 8
          print(f"run={'true' if is_scoring_hour else 'false'}")
          PY

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.scheduled-local-time.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Score responses
        if: github.event_name != 'schedule' || steps.scheduled-local-time.outputs.run == 'true'
        run: |
          if [ -n "${{ inputs.game_date }}" ]; then
            python -m qotd score-responses --game-date "${{ inputs.game_date }}"
          else
            python -m qotd score-responses
          fi
