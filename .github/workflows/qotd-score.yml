name: Score QOTD Responses

on:
  schedule:
    # 15:00 UTC is 08:00 in Phoenix year-round. Fixed UTC scheduling avoids
    # skipping a delayed GitHub Actions run because its runner starts late.
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      game_date:
        description: "Question date to score, formatted YYYY-MM-DD. Leave blank to score the previous game day."
        required: false
        type: string

concurrency:
  group: qotd-morning-state
  cancel-in-progress: false

jobs:
  score-responses:
    runs-on: ubuntu-latest
    environment: production
    env:
      QOTD_SENDER: ${{ secrets.QOTD_SENDER }}
      GOOGLE_CLOUD_PROJECT: question-of-the-day-501919
      BIGQUERY_DATASET: qotd
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Score responses
        run: |
          if [ -n "${{ inputs.game_date }}" ]; then
            python -m qotd score-responses --skip-if-missing-question --game-date "${{ inputs.game_date }}"
          else
            python -m qotd score-responses --skip-if-missing-question
          fi
