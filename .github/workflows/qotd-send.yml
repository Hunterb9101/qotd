name: Send QOTD

on:
  schedule:
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

jobs:
  send-question:
    runs-on: ubuntu-latest
    environment: production
    env:
      QOTD_SENDER: ***SECRET***
      QOTD_DELEGATED_USER: ***SECRET***
      QOTD_CONTACT_GROUP_NAME: QOTD Participants
      QOTD_STATE_PATH: state/questions.jsonl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Write Google service account
        run: |
          credentials_path="${RUNNER_TEMP}/qotd-service-account.json"
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > "$credentials_path"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_path" >> "$GITHUB_ENV"

      - name: Send generated QOTD
        run: python -m qotd send-question
