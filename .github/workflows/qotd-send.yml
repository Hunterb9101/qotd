name: Publish QOTD Question

on:
  schedule:
    # GitHub Actions cron uses UTC. Run at both possible UTC offsets, then
    # admit only the invocation that is in the intended America/Denver hour.
    - cron: "0 18 * * 1-5"
    - cron: "0 19 * * 1-5"
  workflow_dispatch:

concurrency:
  # Serializes scheduled and manually-dispatched publication attempts. Durable
  # outbound-message idempotency remains the final duplicate-send safeguard.
  group: qotd-publication
  cancel-in-progress: false

jobs:
  publish-question:
    runs-on: ubuntu-latest
    environment: production
    env:
      QOTD_SENDER: ${{ secrets.QOTD_SENDER }}
      QOTD_GOOGLE_GROUP_EMAIL: ${{ secrets.QOTD_GOOGLE_GROUP_EMAIL }}
      GOOGLE_CLOUD_PROJECT: question-of-the-day-501919
      BIGQUERY_DATASET: qotd
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm scheduled America/Denver hour
        id: scheduled-hour
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(TZ=America/Denver date +%H)" = "12" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "This UTC trigger is not the 12:00 America/Denver invocation; skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.scheduled-hour.outputs.proceed == 'true'
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.scheduled-hour.outputs.proceed == 'true'
        run: python -m pip install -r requirements.txt

      - name: Publish generated QOTD Question
        if: steps.scheduled-hour.outputs.proceed == 'true'
        run: python -m qotd publish-question
