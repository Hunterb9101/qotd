name: Publish QOTD Question

on:
  schedule:
    # GitHub Actions cron is UTC. These are 12:00 America/Denver across DST;
    # the guard below skips the adjacent, non-12:00 trigger.
    - cron: "0 18,19 * * 1-5"
  workflow_dispatch:

jobs:
  publish-question:
    runs-on: ubuntu-latest
    environment: production
    env:
      QOTD_SENDER: ${{ secrets.QOTD_SENDER }}
      QOTD_GOOGLE_GROUP_EMAIL: ${{ secrets.QOTD_GOOGLE_GROUP_EMAIL }}
      GOOGLE_CLOUD_PROJECT: question-of-the-day-501919
      BIGQUERY_DATASET: qotd
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Confirm scheduled Mountain time
        id: scheduled-local-time
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo

          is_publish_hour = datetime.now(ZoneInfo("America/Denver")).hour == 12
          print(f"run={'true' if is_publish_hour else 'false'}")
          PY

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.scheduled-local-time.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Publish generated QOTD Question
        if: github.event_name != 'schedule' || steps.scheduled-local-time.outputs.run == 'true'
        run: python -m qotd publish-question
