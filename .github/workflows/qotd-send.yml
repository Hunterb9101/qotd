name: Send QOTD

on:
  schedule:
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

jobs:
  send-question:
    runs-on: ubuntu-latest
    environment: production
    env:
      QOTD_SENDER: ***SECRET***
      QOTD_GMAIL_USER: ***SECRET***
      QOTD_CONTACT_GROUP_NAME: QOTD Participants
      QOTD_STATE_PATH: state/questions.jsonl
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send generated QOTD
        run: python -m qotd send-question
