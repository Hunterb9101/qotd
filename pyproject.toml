[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qotd"
version = "0.0.0"
description = "Email-based Question of the Day automation"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
qotd = ["prompts/*.md", "presentation/templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-m 'not intg'"
testpaths = ["tests"]
markers = [
    "intg: live integration tests that require external credentials",
    "requirements(*ids): PRD requirement identifiers covered by a behavioral test",
]
